<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>my-cinematek</title>
    <meta name="description" content="Un journal personnel de films vus au cinéma ou chez soi." />
    <link rel="stylesheet" href="styles.css?v=20260925-08" />
</head>

<body>
    <header class="site-header">
        <div class="container nav-wrap">
            <a href="#top" class="brand">my-cinematek</a>
            <div class="title-language-toggle" role="group" aria-label="Langue des titres">
                <button type="button" data-title-language="fr" aria-pressed="true">FR</button>
                <button type="button" data-title-language="original" aria-pressed="false">VO</button>
            </div>
        </div>
    </header>

    <main id="top" class="container site-main">
        <section class="hero">
            <article id="featured-review" class="featured-review" aria-live="polite"></article>
        </section>

        <div class="diary-layout">
            <section id="diary" class="diary-section">
                <div class="section-head">
                    <p class="eyebrow">mon journal</p>
                    <h2>Critiques</h2>
                </div>
                <div id="posts-list" class="post-list" aria-live="polite"></div>
                <div id="critic-pagination" class="critic-pagination" hidden>
                    <button id="previous-posts" class="secondary-btn" type="button" disabled>&larr; Précédentes</button>
                    <span id="posts-page-label">Page 1</span>
                    <button id="next-posts" class="secondary-btn" type="button" disabled>Suivantes &rarr;</button>
                </div>
            </section>

            <aside id="watched-shelf" class="watched-shelf" aria-labelledby="watched-title">
                <div class="section-head">
                    <p class="eyebrow">vus récemment</p>
                    <h2 id="watched-title">Sans critique</h2>
                </div>
                <div id="watched-list" class="watched-list"></div>
            </aside>
        </div>

    </main>

    <div id="critic-modal" class="critic-modal" hidden>
        <div class="critic-modal-backdrop" data-close-modal></div>
        <article class="critic-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="modal-title">
            <button class="modal-close" type="button" aria-label="Fermer la critique" data-close-modal>&times;</button>
            <div id="modal-content"></div>
        </article>
    </div>

    <div id="film-modal" class="critic-modal" hidden>
        <div class="critic-modal-backdrop" data-close-film-modal></div>
        <article class="critic-modal-dialog film-modal-dialog" role="dialog" aria-modal="true"
            aria-labelledby="film-modal-title">
            <button class="modal-close" type="button" aria-label="Fermer les détails du film"
                data-close-film-modal>&times;</button>
            <div id="film-modal-content"></div>
        </article>
    </div>

    <script src="public.js?v=20260925-04"></script>
</body>

</html>
